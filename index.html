<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d63e7">
<title>부울경 알바 TOP25</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;color:#101828}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}
.hero{height:62px;background:#0863df;color:#fff;padding:10px 14px;display:flex;align-items:flex-start;justify-content:space-between}
.hero h1{margin:0;font-size:23px;font-weight:950;letter-spacing:-1.4px;white-space:nowrap}
.hero h1 b{color:#ffe13b}
.updated{text-align:right;font-size:8px;line-height:1.45;color:#dbeafe;padding-top:3px}
.updated b{display:block;font-size:10px;color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px 12px 5px}
.tab{height:38px;border:1px solid #d8dee8;background:#f8fafc;border-radius:9px;font-size:12px;font-weight:900;color:#172033}
.tab.active{background:#0863df;border-color:#0863df;color:#fff}
.tab.carrot.active{background:#ff6f0f;border-color:#ff6f0f}
.daytabs{display:flex;gap:6px;padding:0 12px 6px}
.daytab{flex:1;height:31px;border:1px solid #d8dee8;background:#fff;border-radius:8px;font-size:11px;font-weight:850}
.daytab.active{background:#eef5ff;border-color:#75aaf2;color:#075dcf}
.sortbar{display:flex;align-items:center;gap:6px;padding:5px 14px 9px;border-bottom:1px solid #e9edf3;color:#667085;font-size:11px}
.sortbar b{color:#0b63dc}
.count{margin-left:auto;font-weight:800;color:#344054}
.list{padding:0 14px 22px}
.job{position:relative;border-bottom:1px solid #e7ebf0;padding:13px 28px 12px 0;cursor:pointer}
.row{display:flex;align-items:flex-start;gap:7px;min-width:0}
.badge,.paytype{flex:0 0 auto;border-radius:6px;padding:3px 6px;font-size:9px;font-weight:900}
.badge{background:#fff0e7;color:#e85c0c}.badge.alba{background:#fff0a8;color:#202020}.badge.carrot{background:#fff0e7;color:#e85c0c}
.paytype.daily{background:#ff3347;color:#fff}.paytype.hourly{background:#0863df;color:#fff}
.main{min-width:0;flex:1}.titleline{display:flex;align-items:baseline;gap:8px;min-width:0}.titleline .title{flex:1;min-width:0}.titlepay{flex:0 0 auto;font-size:13px;font-weight:950;color:#0863df;white-space:nowrap}
.title{font-size:14px;font-weight:900;line-height:1.32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.company{margin-top:3px;color:#536174;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay{display:none}
.meta{margin-top:5px;color:#687588;font-size:10px;line-height:1.5}
.arrow{position:absolute;right:2px;top:48%;transform:translateY(-50%);font-size:24px;color:#8c99a8}
.unknown .titlepay{color:#667085}.unknown .paytype{background:#eef1f5;color:#667085}
.empty{margin:25px 4px;padding:34px 12px;text-align:center;color:#718096;border:1px dashed #ccd5e0;border-radius:12px;font-size:14px}
.note{padding:2px 14px 24px;text-align:center;color:#98a2b3;font-size:9px}
@media(max-width:390px){.hero h1{font-size:21px}.title{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
 <h1>부울경 알바 <b>TOP25</b></h1>
 <div class="updated">최종 업데이트<b id="updated">확인 중</b></div>
</header>
<nav class="tabs">
 <button id="generalTab" class="tab active" onclick="setTab('general')">알바몬 + 알바천국</button>
 <button id="daangnTab" class="tab carrot" onclick="setTab('daangn')">당근알바</button>
</nav>
<div id="daytabs" class="daytabs">
 <button id="allDay" class="daytab active" onclick="setDay('all')">전체</button>
 <button id="weekdayDay" class="daytab" onclick="setDay('평일')">평일</button>
 <button id="weekendDay" class="daytab" onclick="setDay('주말')">주말</button>
</div>
<div class="sortbar"><span>정렬</span><b>일급 → 시급 → 급여 확인</b><span id="count" class="count"></span></div>
<main id="list" class="list"></main>
<div class="note">공개적으로 접근 가능한 공고만 표시합니다.</div>
</div>
<script>
let DATA=null,TAB='general',DAY='all';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function payInfo(j){
 if(Number(j.explicit_day_pay||0)>0) return {text:'일급 '+Number(j.explicit_day_pay).toLocaleString('ko-KR')+'원',type:'일급',cls:'daily',rank:0,amount:Number(j.explicit_day_pay)};
 if(Number(j.hourly_pay||0)>0) return {text:'시급 '+Number(j.hourly_pay).toLocaleString('ko-KR')+'원',type:'시급',cls:'hourly',rank:1,amount:Number(j.hourly_pay)};
 return {text:'급여 확인',type:'확인',cls:'',rank:2,amount:0};
}
function sourceCls(s){return s==='당근알바'?'carrot':s==='알바천국'?'alba':''}
function hoursText(t){
 if(!t||t==='시간 확인') return '시간 확인';
 let m=String(t).match(/(\d{1,2}):(\d{2})\s*[~～\-]\s*(\d{1,2}):(\d{2})/);
 if(!m) return t;
 let a=Number(m[1])+Number(m[2])/60,b=Number(m[3])+Number(m[4])/60;if(b<a)b+=24;
 let h=Math.max(0,b-a),label=Number.isInteger(h)?h:String(Math.round(h*10)/10);
 return t+' · 약 '+label+'시간';
}
function setTab(t){
 TAB=t; DAY='all';
 generalTab.classList.toggle('active',t==='general'); daangnTab.classList.toggle('active',t==='daangn');
 daytabs.style.display=t==='general'?'flex':'none';
 allDay.classList.add('active'); weekdayDay.classList.remove('active'); weekendDay.classList.remove('active');
 render();
}
function setDay(d){DAY=d;allDay.classList.toggle('active',d==='all');weekdayDay.classList.toggle('active',d==='평일');weekendDay.classList.toggle('active',d==='주말');render()}
function render(){
 if(!DATA)return;
 let jobs=(TAB==='general'?(DATA.general_jobs||[]):(DATA.daangn_jobs||[]));
 if(TAB==='general'&&DAY==='평일')jobs=jobs.filter(j=>j.day_group==='평일'||j.day_group==='평일+주말');
 if(TAB==='general'&&DAY==='주말')jobs=jobs.filter(j=>j.day_group==='주말'||j.day_group==='평일+주말');
 jobs=jobs.slice().sort((a,b)=>{let A=payInfo(a),B=payInfo(b);return A.rank-B.rank||B.amount-A.amount}).slice(0,25);
 count.textContent='총 '+jobs.length+'건';
 list.innerHTML='';
 if(!jobs.length){list.innerHTML='<div class="empty">현재 표시할 공고가 없습니다.</div>';return}
 jobs.forEach(j=>{
  let p=payInfo(j),company=(j.company||'').trim()||'',date=j.work_date||'근무일 확인',time=hoursText(j.work_time);
  let e=document.createElement('article');e.className='job '+(p.rank===2?'unknown':'');
  e.innerHTML=`<div class="row"><span class="badge ${sourceCls(j.source)}">${esc(j.source)}</span><span class="paytype ${p.cls}">${p.type}</span><div class="main"><div class="titleline"><div class="title">${esc(j.title)}</div><div class="titlepay">${esc(p.text)}</div></div>${company?`<div class="company">${esc(company)}</div>`:''}</div></div><div class="meta">${esc(j.region||'-')} · ${esc(date)} · ${esc(time)}</div><div class="arrow">›</div>`;
  e.onclick=()=>j.url&&window.open(j.url,'_blank','noopener');list.appendChild(e);
 });
}
async function load(){try{let r=await fetch('jobs.json?t='+Date.now(),{cache:'no-store'});DATA=await r.json();updated.textContent=DATA.updated_at_kst||'-';render()}catch(e){updated.textContent='불러오기 실패'}}
load();setInterval(load,60000);
</script>
</body></html>
